{% extends "layout.html" %}

{% block title %}Login — DnD Manager{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-950">
    <div class="w-full max-w-sm bg-gray-900 rounded-2xl shadow-xl p-8 border border-gray-800">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3">⚔️</div>
            <h1 class="text-2xl font-bold text-white">DnD Campaign Manager</h1>
            <p class="text-gray-400 text-sm mt-1">Sign in to continue</p>
        </div>

        {% if error %}
        <div class="mb-4 px-4 py-3 rounded-lg bg-red-900/50 border border-red-700 text-red-300 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">
                    Username
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autofocus
                    class="w-full px-4 py-2.5 rounded-lg bg-gray-800 border border-gray-700
                           text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500
                           focus:ring-1 focus:ring-indigo-500 transition"
                    placeholder="Enter your username"
                />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-2.5 rounded-lg bg-gray-800 border border-gray-700
                           text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500
                           focus:ring-1 focus:ring-indigo-500 transition"
                    placeholder="Enter your password"
                />
            </div>

            <button
                type="submit"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white
                       font-semibold rounded-lg transition-colors focus:outline-none
                       focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
                       focus:ring-offset-gray-900">
                Sign In
            </button>
        </form>

    </div>
</div>
{% endblock %}
