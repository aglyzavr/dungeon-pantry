{% extends "layout.html" %}

{% block title %}{{ _("Settings") }} - DnD Manager{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
  <h1 class="text-3xl font-bold mb-8">{{ _("Settings") }}</h1>

  {# Language Settings #}
  <div class="bg-gray-800 rounded-lg p-6 mb-6">
    <h2 class="text-xl font-semibold mb-4">{{ _("Language") }}</h2>
    <form method="post" action="/settings/language" class="space-y-4">
      <div class="space-y-2">
        <label class="flex items-center space-x-3 p-3 bg-gray-700 rounded cursor-pointer hover:bg-gray-600 transition">
          <input 
            type="radio" 
            name="language" 
            value="en" 
            {% if current_user.language == "en" %}checked{% endif %}
            class="w-4 h-4 text-blue-600"
          />
          <span class="text-gray-100">{{ _("English") }}</span>
        </label>
        
        <label class="flex items-center space-x-3 p-3 bg-gray-700 rounded cursor-pointer hover:bg-gray-600 transition">
          <input 
            type="radio" 
            name="language" 
            value="ru" 
            {% if current_user.language == "ru" %}checked{% endif %}
            class="w-4 h-4 text-blue-600"
          />
          <span class="text-gray-100">{{ _("Russian") }}</span>
        </label>
      </div>

      <div class="flex justify-end space-x-3 mt-6">
        <a 
          href="/campaigns" 
          class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded transition"
        >
          {{ _("Cancel") }}
        </a>
        <button 
          type="submit" 
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded transition"
        >
          {{ _("Save") }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
