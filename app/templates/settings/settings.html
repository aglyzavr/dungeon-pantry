{% extends "layout.html" %}

{% block title %}{{ _("Settings") }} - Dungeon Pantry{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/css/settings.css" />

<div class="settings-container">
  <h1 class="settings-heading">{{ _("Settings") }}</h1>

  {# Language Settings #}
  <div class="settings-section">
    <h2 class="settings-title">{{ _("Language") }}</h2>
    <form method="post" action="/settings/language" class="settings-form-space">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <div class="settings-form-space">
        <label class="settings-option">
          <input 
            type="radio" 
            name="language" 
            value="en" 
            {% if current_user.language == "en" %}checked{% endif %}
          />
          <span>{{ _("English") }}</span>
        </label>
        
        <label class="settings-option">
          <input 
            type="radio" 
            name="language" 
            value="ru" 
            {% if current_user.language == "ru" %}checked{% endif %}
          />
          <span>{{ _("Russian") }}</span>
        </label>
      </div>

      <div class="settings-actions">
        <a 
          href="/campaigns" 
          class="btn-cancel"
        >
          {{ _("Cancel") }}
        </a>
        <button 
          type="submit" 
          class="btn-save"
        >
          {{ _("Save") }}
        </button>
      </div>
    </form>
  </div>

  {# Theme Settings #}
  <div class="settings-section">
    <h2 class="settings-title">{{ _("Theme") }}</h2>
    <form method="post" action="/settings/theme" class="settings-form-space">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <div class="settings-form-space">
        <label class="settings-option">
          <input 
            type="radio" 
            name="theme" 
            value="light" 
            {% if current_user.theme == "light" %}checked{% endif %}
          />
          <span>{{ _("Light Theme") }}</span>
        </label>
        
        <label class="settings-option">
          <input 
            type="radio" 
            name="theme" 
            value="dark" 
            {% if current_user.theme == "dark" %}checked{% endif %}
          />
          <span>{{ _("Dark Theme") }}</span>
        </label>
      </div>

      <div class="settings-actions">
        <a 
          href="/campaigns" 
          class="btn-cancel"
        >
          {{ _("Cancel") }}
        </a>
        <button 
          type="submit" 
          class="btn-save"
        >
          {{ _("Save") }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
