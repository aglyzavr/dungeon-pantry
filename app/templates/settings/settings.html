{% extends "layout.html" %}

{% block title %}{{ _("Settings") }} - Campaign Manager{% endblock %}

{% block content %}
<style>
  .settings-section {
    background-color: var(--color-form-bg);
    border: 1px solid var(--color-border);
    border-radius: 0.5rem;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .settings-title {
    font-size: 1.125rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--color-text-primary);
  }

  .settings-form-space {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .settings-option {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    background-color: var(--color-bg-secondary);
    border-radius: 0.375rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .settings-option:hover {
    background-color: var(--color-bg-light);
  }

  .settings-option input[type="radio"] {
    width: 1rem;
    height: 1rem;
    cursor: pointer;
  }

  .settings-option label {
    cursor: pointer;
    color: var(--color-text-primary);
    margin: 0;
    flex: 1;
  }

  .settings-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }

  .btn-cancel {
    padding: 0.5rem 1rem;
    background-color: var(--color-bg-secondary);
    color: var(--color-text-secondary);
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }

  .btn-cancel:hover {
    background-color: var(--color-bg-light);
  }

  .btn-save {
    padding: 0.5rem 1rem;
    background-color: var(--color-button-bg);
    color: var(--color-text-primary);
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-save:hover {
    background-color: var(--color-button-hover);
  }

  .settings-container {
    max-width: 42rem;
    margin: 0 auto;
    padding: 0 1rem;
  }
</style>

<div class="settings-container">
  <h1 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 2rem; color: var(--color-text-primary);">{{ _("Settings") }}</h1>

  {# Language Settings #}
  <div class="settings-section">
    <h2 class="settings-title">{{ _("Language") }}</h2>
    <form method="post" action="/settings/language" class="settings-form-space">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <div class="settings-form-space">
        <label class="settings-option">
          <input 
            type="radio" 
            name="language" 
            value="en" 
            {% if current_user.language == "en" %}checked{% endif %}
          />
          <span>{{ _("English") }}</span>
        </label>
        
        <label class="settings-option">
          <input 
            type="radio" 
            name="language" 
            value="ru" 
            {% if current_user.language == "ru" %}checked{% endif %}
          />
          <span>{{ _("Russian") }}</span>
        </label>
      </div>

      <div class="settings-actions">
        <a 
          href="/campaigns" 
          class="btn-cancel"
        >
          {{ _("Cancel") }}
        </a>
        <button 
          type="submit" 
          class="btn-save"
        >
          {{ _("Save") }}
        </button>
      </div>
    </form>
  </div>

  {# Theme Settings #}
  <div class="settings-section">
    <h2 class="settings-title">{{ _("Theme") }}</h2>
    <form method="post" action="/settings/theme" class="settings-form-space">
      <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <div class="settings-form-space">
        <label class="settings-option">
          <input 
            type="radio" 
            name="theme" 
            value="light" 
            {% if current_user.theme == "light" %}checked{% endif %}
          />
          <span>{{ _("Light Theme") }}</span>
        </label>
        
        <label class="settings-option">
          <input 
            type="radio" 
            name="theme" 
            value="dark" 
            {% if current_user.theme == "dark" %}checked{% endif %}
          />
          <span>{{ _("Dark Theme") }}</span>
        </label>
      </div>

      <div class="settings-actions">
        <a 
          href="/campaigns" 
          class="btn-cancel"
        >
          {{ _("Cancel") }}
        </a>
        <button 
          type="submit" 
          class="btn-save"
        >
          {{ _("Save") }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
