<div id="portrait-upload-modal" class="modal-overlay" onclick="event.target === this && closePortraitModal()">
    <div class="modal-container">
        <div class="modal-header">
            <h2>{{ _("Upload Character Portrait") }}</h2>
            <button class="modal-close" onclick="closePortraitModal()" type="button">✕</button>
        </div>

        <div class="modal-body">
            {% if error %}
            <div class="modal-error">{{ error }}</div>
            {% endif %}

            <form
                id="portrait-upload-form"
                hx-post="/characters/{{ character.id }}/portrait/upload"
                hx-encoding="multipart/form-data"
                hx-target="#sheet-header"
                hx-swap="outerHTML swap:1s"
                class="portrait-upload-form"
            >
                <div class="form-group">
                    <label for="portrait-file" class="form-label">{{ _("Select Image") }}</label>
                    <input
                        type="file"
                        id="portrait-file"
                        name="file"
                        accept=".jpg,.jpeg,.png"
                        required
                        class="form-input-file"
                    />
                    <div class="form-help-text">
                        {{ _("Supported formats: JPEG, PNG | Maximum size: 5MB") }}
                    </div>
                </div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="btn-secondary"
                        onclick="closePortraitModal()"
                    >
                        {{ _("Cancel") }}
                    </button>
                    <button type="submit" class="btn-primary">
                        {{ _("Upload Portrait") }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function closePortraitModal() {
    const modal = document.getElementById('portrait-upload-modal');
    if (modal) {
        modal.remove();
    }
}

function showSuccessNotification(message) {
    const notification = document.createElement('div');
    notification.className = 'success-notification';
    notification.innerHTML = `
        <div class="success-notification-content">
            <div class="success-notification-icon">✓</div>
            <div class="success-notification-message">${message}</div>
        </div>
    `;
    document.body.appendChild(notification);
    
    // Auto remove after 3 seconds
    setTimeout(() => {
        notification.classList.add('fade-out');
        setTimeout(() => {
            notification.remove();
        }, 300);
    }, 3000);
}

// Handle HTMX response events
document.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'sheet-header') {
        // Sheet header was updated, which means portrait upload was successful
        closePortraitModal();
        showSuccessNotification('Portrait successfully updated!');
    }
});

// Also handle form submission errors
document.getElementById('portrait-upload-form').addEventListener('htmx:responseError', function(event) {
    console.error('Upload failed:', event);
});
</script>
